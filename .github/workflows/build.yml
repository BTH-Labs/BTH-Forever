name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MODPACK_DIR: BTH-Forever

jobs:
  build:
    name: Validate & export modpack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Refresh & export modpack
        working-directory: ${{ env.MODPACK_DIR }}
        run: |
          nix develop --command packwiz refresh
          nix develop --command packwiz modrinth export

      - name: Upload .mrpack artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.MODPACK_DIR }}-mrpack
          path: ${{ env.MODPACK_DIR }}/*.mrpack
          if-no-files-found: error
