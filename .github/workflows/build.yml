name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MODPACK_DIR: BTH-Forever

jobs:
  build:
    name: Validate & export modpack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1

      - name: Refresh & export modpack
        working-directory: ${{ env.MODPACK_DIR }}
        run: |
          nix develop --command packwiz refresh
          nix develop --command packwiz modrinth export

      - name: Upload .mrpack artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.MODPACK_DIR }}-mrpack
          path: ${{ env.MODPACK_DIR }}/*.mrpack
          if-no-files-found: error
