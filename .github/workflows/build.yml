name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MODPACK_DIR: BTH-Forever

jobs:
  build:
    name: Validate & export modpack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Guard against committed generated state
        run: |
          fail=0

          if [ -n "$(git ls-files "$MODPACK_DIR/index.toml")" ]; then
            echo "::error ::$MODPACK_DIR/index.toml is tracked. It is generated by 'packwiz refresh' and must not be committed."
            fail=1
          fi

          if grep -Eq '^hash = "[0-9a-f]{64}"$' "$MODPACK_DIR/pack.toml"; then
            echo "::error ::$MODPACK_DIR/pack.toml has a non-empty [index] hash. It must be committed as: hash = \"\""
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error ::Generated state must not be committed. Set $MODPACK_DIR/pack.toml's [index] hash back to \"\" and remove $MODPACK_DIR/index.toml from git. CI regenerates both with 'packwiz refresh'."
            exit 1
          fi

      - name: Refresh & export modpack
        working-directory: ${{ env.MODPACK_DIR }}
        run: |
          # Stamp a build version into pack.toml so non-release exports are
          # identifiable. Prefer the PR head commit; fall back to the pushed sha.
          # Anchored to ^version to leave pack-format untouched.
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          sed -i -E "s/^version = \".*\"/version = \"build-${sha::7}\"/" pack.toml

          # index.toml is gitignored; packwiz refresh updates an existing index
          # rather than creating one, so seed an empty header on a fresh checkout.
          # refresh then rebuilds every [[files]] entry from the pack folders.
          [ -f index.toml ] || printf 'hash-format = "sha256"\n' > index.toml
          nix develop --command packwiz refresh
          nix develop --command packwiz modrinth export

      - name: Upload .mrpack artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.MODPACK_DIR }}-mrpack
          path: ${{ env.MODPACK_DIR }}/*.mrpack
          if-no-files-found: error
